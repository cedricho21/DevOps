      labels:
        app: session 
    spec:
      containers:
        - name: session-service 
          image: beyonder112/devops_7:session 
          env:
            - name: POSTGRES_HOST 
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_HOST 
            - name: POSTGRES_PORT 
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER 
              valueFrom:
                secretKeyRef:
                  name: db-secrets 
                  key: POSTGRES_USER  
            - name: POSTGRES_PASSWORD 
              valueFrom:
                secretKeyRef:
                  name: db-secrets 
                  key: POSTGRES_PASSWORD  
            - name: POSTGRES_DB 
              value : "users_db"

---
apiVersion: v1
