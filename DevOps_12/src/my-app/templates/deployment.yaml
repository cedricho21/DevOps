apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.image.postgres.repository }}:{{ .Values.image.postgres.tag }}"
          env:
            - name: POSTGRES_USER 
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }} 
                  key: POSTGRES_USER  
            - name: POSTGRES_PASSWORD 
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }} 
                  key: POSTGRES_PASSWORD 
          ports:
            - containerPort: {{ .Values.services.postgres.port }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: rabbitmq
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: "{{ .Values.image.rabbitmq.repository }}:{{ .Values.image.rabbitmq.tag }}"
          envFrom:
            - configMapRef:
                name: {{ .Values.configMap.name }}

