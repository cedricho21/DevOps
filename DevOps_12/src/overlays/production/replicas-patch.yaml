apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 3 
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway 
  template:
    metadata:
      labels:
        app: gateway 
    spec:
      containers:
        - name: gateway 
          image: beyonder112/devops_7:gateway 
          env:
            - name: HOTEL_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: HOTEL_SERVICE_HOST
            - name: HOTEL_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: HOTEL_SERVICE_PORT
            - name: PAYMENT_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PAYMENT_SERVICE_HOST
            - name: PAYMENT_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PAYMENT_SERVICE_PORT
            - name: LOYALTY_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOYALTY_SERVICE_HOST
            - name: LOYALTY_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOYALTY_SERVICE_PORT
            - name: REPORT_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REPORT_SERVICE_HOST
            - name: REPORT_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REPORT_SERVICE_PORT
            - name: BOOKING_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BOOKING_SERVICE_HOST
            - name: BOOKING_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BOOKING_SERVICE_PORT
            - name: SESSION_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SESSION_SERVICE_HOST
            - name: SESSION_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SESSION_SERVICE_PORT
