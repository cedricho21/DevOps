global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "192.168.56.10:9093"

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'blackbox_exporter'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://www.google.com 
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['192.168.56.10:8087']

  - job_name: 'session'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['192.168.56.10:8081']

  - job_name: 'report'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['192.168.56.10:8086']

  - job_name: 'booking'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['192.168.56.10:8083']