apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: beyonder112/postgres:latest
          env:
            - name: POSTGRES_USER 
              valueFrom:
                secretKeyRef:
                  name: db-secrets 
                  key: POSTGRES_USER  
            - name: POSTGRES_PASSWORD 
              valueFrom:
                secretKeyRef:
                  name: db-secrets 
                  key: POSTGRES_PASSWORD 
          ports:
            - containerPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:management
          envFrom:
            - configMapRef:
                name: app-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: session
    spec:
      containers:
        - name: session-service
          image: beyonder112/devops_7:session
          env:
            - name: PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: private-key
                  key: privateKey
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value : "users_db"

